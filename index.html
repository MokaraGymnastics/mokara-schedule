<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mokara Gymnastics — Live Schedule</title>
<style>
  :root {
    --navy: #1B365D;
    --navy-deep: #122441;
    --teal-bright: #A4DBE8;
    --teal-light: #D1EDF3;
    --purple-blue: #8094DD;
    --purple-light: #BECAEA;
    --cream: #F2F1E7;
    --yellow: #F8EBB1;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--navy-deep); overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--cream); }
  #page { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--navy-deep); }
  #topBar { flex: 0 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: clamp(16px, 2.4vw, 40px); padding: clamp(8px, 1.1vh, 16px) clamp(18px, 2.2vw, 38px); background: var(--navy); box-shadow: 0 3px 14px rgba(0,0,0,0.35); border-bottom: 3px solid var(--yellow); }
  #brand { justify-self: start; font-weight: 800; letter-spacing: 2px; font-size: clamp(18px, 2.6vh, 28px); color: var(--cream); white-space: nowrap; }
  #headerCenter { justify-self: center; display: flex; align-items: baseline; gap: clamp(14px, 2vw, 30px); }
  #dayLabel { font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; font-size: clamp(60px, 9.5vh, 118px); color: var(--teal-bright); white-space: nowrap; }
  #clockTime { font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; font-size: clamp(60px, 9.5vh, 118px); color: var(--cream); white-space: nowrap; }
  #weekCol { justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  #weekLabel { font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; font-size: clamp(18px, 2.6vh, 28px); color: var(--cream); white-space: nowrap; }
  #lessonPlanLabel { font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; font-size: clamp(13px, 1.7vh, 19px); color: var(--cream); opacity: 0.72; white-space: nowrap; display: none; }
  #body { flex: 1 1 auto; display: flex; min-height: 0; }
  #gridArea { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: clamp(8px, 1.1vh, 16px) clamp(14px, 1.8vw, 28px); overflow: hidden; }
  #ruler { display: flex; flex: 0 0 auto; height: clamp(26px, 3.2vh, 42px); margin-left: var(--label-width, 210px); position: relative; border-bottom: 2px solid rgba(255,255,255,0.18); margin-bottom: 4px; }
  .rulerTick { position: absolute; top: 0; bottom: 0; display: flex; align-items: flex-end; font-size: clamp(15px, 1.9vh, 22px); color: var(--teal-light); opacity: 0.8; border-left: 1px solid rgba(255,255,255,0.14); padding-left: 5px; font-weight: 600; }
  .rulerTick.major { color: var(--cream); opacity: 1; font-weight: 800; border-left-color: rgba(255,255,255,0.35); }
  #rows { flex: 1 1 auto; display: flex; flex-direction: column; gap: clamp(4px, 0.7vh, 9px); overflow-y: auto; min-height: 0; }
  .squadRow { flex: 1 1 0; display: flex; align-items: stretch; min-height: 0; }
  .squadLabel { flex: 0 0 var(--label-width, 210px); width: var(--label-width, 210px); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; font-weight: 800; font-size: clamp(19px, 2.6vh, 30px); padding-right: 12px; color: var(--teal-bright); }
  .squadLabel .sqTag { font-size: 0.56em; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.85; margin-top: 2px; }
  .squadLabel.cat-comp { color: var(--purple-light); }
  .squadLabel.cat-comp .sqTag { color: var(--purple-blue); }
  .squadLabel.cat-rec { color: var(--yellow); }
  .squadLabel.cat-rec .sqTag { color: var(--yellow); }
  .groupDivider { flex: 0 0 auto; height: 1px; background: rgba(255,255,255,0.12); margin: 2px 0 2px var(--label-width, 210px); }
  /* squadTrackWrap stacks an optional classTagRow (the "Little Sprouts 1" / "Growing Sprouts 2"
     style banner the coaches write directly above a squad's row in the sheet) on top of that
     squad's own squadTrack. Rows with no banner above them in the sheet get no classTagRow at
     all, so they're unaffected and keep their full track height exactly as before. */
  .squadTrackWrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .classTagRow { position: relative; flex: 0 0 auto; height: clamp(11px, 1.5vh, 15px); margin-bottom: 2px; }
  .classTag { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28); border-radius: 5px; box-sizing: border-box; font-size: clamp(7.5px, 0.95vh, 10.5px); font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; color: #fff; overflow: hidden; white-space: nowrap; padding: 0 3px; }
  .squadTrack { position: relative; flex: 1 1 auto; min-height: 0; background: rgba(255,255,255,0.05); border-radius: 8px; }
  .block { position: absolute; top: 4px; bottom: 4px; border-radius: 7px; box-sizing: border-box; padding: 6px 9px; overflow: hidden; font-size: clamp(12px, 1.7vh, 18px); line-height: 1.25; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
  .block .label { font-weight: 800; display: block; }
  .block .loc { display: block; opacity: 0.9; font-size: 0.85em; font-weight: 700; margin-top: 1px; }
  .block .time { display: block; opacity: 0.85; font-size: 0.7em; font-weight: 700; margin-top: 1px; white-space: normal; overflow-wrap: break-word; word-break: keep-all; }
  #emptyMsg, #errorMsg { margin: auto; text-align: center; opacity: 0.85; font-size: clamp(16px, 2.2vh, 26px); padding: 20px; color: var(--teal-light); }
  #legend { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: clamp(10px, 1.4vw, 24px); align-items: center; padding: clamp(5px, 0.8vh, 11px) clamp(18px, 2.2vw, 38px); background: var(--navy-deep); font-size: clamp(11px, 1.3vh, 15px); border-top: 1px solid rgba(255,255,255,0.1); }
  .legendItem { display: flex; align-items: center; gap: 8px; opacity: 0.95; color: var(--teal-light); }
  .legendSwatch { display: inline-flex; align-items: center; justify-content: center; padding: 3px 9px; border-radius: 6px; font-weight: 800; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="page">
  <div id="topBar">
    <div id="brand">MOKARA GYMNASTICS</div>
    <div id="headerCenter">
      <div id="dayLabel">-</div>
      <div id="clockTime">--:--</div>
    </div>
    <div id="weekCol">
      <div id="weekLabel">-</div>
      <div id="lessonPlanLabel"></div>
    </div>
  </div>
  <div id="body">
    <div id="gridArea">
      <div id="ruler"></div>
      <div id="rows"></div>
    </div>
  </div>
  <div id="legend"></div>
</div>
<script>
  // ---- Configuration ----
  var SHEET_ID = "1Mc3GH64jMGS2weZvh-4RcRgvtP7jakxCSPulJwK2uso";
  var API_KEY = "AIzaSyA2-7pL3Dy9-DTXbtVp2SXRQgeOOrtN86s";
  var TIMEZONE = "Asia/Singapore";
  var REFRESH_MS = 120000;
  var WEEK1_ANCHOR = "2026-09-07"; // Monday — Week 1 of the 9-week curriculum cycle
  // Coaches now run a clean 3-tab rotation (A/B/C) that repeats 3 times to make a 9-week
  // curriculum cycle (weeks 1,4,7 -> A; 2,5,8 -> B; 3,6,9 -> C).
  var TAB_CYCLE = ["A - WK 1-4-7", "B - WK 2-5-8", "C - WK 3-6-9"];
  // One-off corrections for a specific calendar week, keyed by that week's Monday (YYYY-MM-DD),
  // for when the coaches' actual week count doesn't match the formula below (e.g. a holiday
  // paused the rotation) without changing the formula for every other week. Each entry is a
  // single real-world confirmation from the coaches, not a guess.
  var WEEK_OVERRIDES = {
    "2026-10-05": { tabName: "C - WK 3-6-9", weekNumber: 3 } // Deepa corrected Oct 5 week to "Week 3" (was first told Week 4 earlier the same day) — 2026-10-05
  };
  // Which "Lesson Plan" (the coaches' separate 9-week curriculum block number, distinct from
  // the WK1-9/tab-ABC cycle above) applies to a given calendar week. This does NOT follow a
  // fixed formula — the coaches confirmed the normal 1->2->3->1->2->3... rotation was broken
  // once (a Lesson Plan 4 was inserted between a Plan 3 and a Plan 2 block), so this is a
  // plain lookup of real-world confirmations, keyed by that week's Monday (YYYY-MM-DD), in the
  // same spirit as WEEK_OVERRIDES above. A week with no entry here just shows no Lesson Plan
  // badge rather than guessing — add a new row as soon as the next block is confirmed (e.g.
  // Deepa says "committed" after updating the whiteboard), don't extrapolate ahead of it.
  var LESSON_PLAN_BY_WEEK = {
    "2026-10-19": 3, "2026-10-26": 3, "2026-11-02": 3, // Lesson Plan 3 (WK7,8,9)
    "2026-11-09": 4, "2026-11-16": 4, "2026-11-23": 4, // Lesson Plan 4 (WK1,2,3) — one-off, replaces what would normally have been Plan 1
    "2026-11-30": 2, "2026-12-07": 2, "2026-12-14": 2, // Lesson Plan 2 (WK4,5,6)
    "2026-12-21": 3, "2026-12-28": 3, "2027-01-04": 3, // Lesson Plan 3 again (WK7,8,9) — confirmed by Deepa 2026-11-11, normal rotation resumes
    "2027-01-11": 1, "2027-01-18": 1, "2027-01-25": 1  // Lesson Plan 1 (WK1,2,3) — confirmed by Deepa 2026-11-11, back to the normal 1->2->3 cycle
  };
  // Squads NOT in this list are treated as Rec (named/individual squads). Update here if the coaches add new Comp squads.
  var COMP_SQUADS = ["16s 20s 23s", "12s", "12s 16s", "Pre-Devo", "Pre-Devo = Devo 2", "23/20s", "16s", "PRIME"];
  var WEEKEND_CUTOFF_MIN = 13 * 60 + 30; // 1:30pm — splits Saturday/Sunday into AM/PM sections
  var DAY_LABEL_RE = /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday AM|Saturday PM|Sunday AM|Sunday PM)$/;
  // One fixed, distinct color per activity type — this is the single source of truth for
  // BOTH the legend chips and the actual schedule blocks, so they always match.
  var CODE_COLORS = {
    WU: "#90CBDF", // Warm Up
    VT: "#7179D6", // Vault
    UB: "#F1D47E", // Uneven Bars
    BB: "#DD7D5F", // Balance Beam
    FX: "#BF69BF", // Floor Exercise
    TR: "#5CC1A0", // Trampoline
    KG: "#646D87"  // Kindy Gym area
  };
  var BREAK_COLOR = "#000000";

  function getNow() {
    var params = new URLSearchParams(window.location.search);
    var override = params.get("debug_now");
    return override ? new Date(override) : new Date();
  }

  function getPartsInTZ(date) {
    var fmt = new Intl.DateTimeFormat("en-CA", {
      timeZone: TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false, weekday: "long"
    });
    var parts = {};
    fmt.formatToParts(date).forEach(function (p) { parts[p.type] = p.value; });
    return parts;
  }

  function dateOnlyUTC(y, m, d) { return Date.UTC(y, m - 1, d); }

  function categorize(squadName) {
    return COMP_SQUADS.indexOf(squadName.trim()) !== -1 ? "Comp" : "Rec";
  }

  function colorToHex(c) {
    if (!c) return null;
    function ch(v) { return Math.round((v || 0) * 255).toString(16).padStart(2, "0"); }
    return "#" + ch(c.red) + ch(c.green) + ch(c.blue);
  }

  function luminance(hex) {
    var h = hex.replace("#", "");
    var r = parseInt(h.substr(0, 2), 16) / 255;
    var g = parseInt(h.substr(2, 2), 16) / 255;
    var b = parseInt(h.substr(4, 2), 16) / 255;
    function lin(c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }

  function textColorFor(hex) {
    return luminance(hex) > 0.5 ? "#16233b" : "#ffffff";
  }

  // Text inside the schedule blocks is black by default; only a near-black background
  // (like the "Break" cells) gets white text instead.
  function blockTextColor(hex) {
    return luminance(hex) < 0.12 ? "#ffffff" : "#000000";
  }

  function computeWeekAndSection(now) {
    var parts = getPartsInTZ(now);
    var y = parseInt(parts.year, 10), m = parseInt(parts.month, 10), d = parseInt(parts.day, 10);
    var startBits = WEEK1_ANCHOR.split("-").map(Number);
    var startUTC = dateOnlyUTC(startBits[0], startBits[1], startBits[2]);
    var todayUTC = dateOnlyUTC(y, m, d);
    var daysSinceStart = Math.round((todayUTC - startUTC) / 86400000);
    var weekIndex0 = Math.floor(daysSinceStart / 7);
    var mondayUTC = startUTC + weekIndex0 * 7 * 86400000;
    var mondayDate = new Date(mondayUTC);
    var mondayKey = mondayDate.getUTCFullYear() + "-" + String(mondayDate.getUTCMonth() + 1).padStart(2, "0") + "-" + String(mondayDate.getUTCDate()).padStart(2, "0");
    var override = WEEK_OVERRIDES[mondayKey];
    var weekNumber, tabName;
    if (override) {
      weekNumber = override.weekNumber;
      tabName = override.tabName;
    } else {
      weekNumber = (((weekIndex0 % 9) + 9) % 9) + 1; // displayed week, cycles 1-9
      var tabIndex = ((weekIndex0 % 3) + 3) % 3; // which of the 3 tabs (A/B/C) applies
      tabName = TAB_CYCLE[tabIndex];
    }
    var weekday = parts.weekday; // e.g. "Monday"
    var minutesOfDay = parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
    var sectionLabel = weekday;
    if (weekday === "Saturday" || weekday === "Sunday") {
      sectionLabel = weekday + (minutesOfDay < WEEKEND_CUTOFF_MIN ? " AM" : " PM");
    }
    var lessonPlan = LESSON_PLAN_BY_WEEK[mondayKey] || null;
    return { weekNumber: weekNumber, tabName: tabName, sectionLabel: sectionLabel, weekday: weekday, lessonPlan: lessonPlan };
  }

  function sheetsApiUrl(ranges, fields) {
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "?includeGridData=true&key=" + API_KEY + "&fields=" + encodeURIComponent(fields);
    ranges.forEach(function (r) { url += "&ranges=" + encodeURIComponent(r); });
    return url;
  }

  function fetchGrids(tabNames) {
    var fields = "sheets(properties.title,merges,data.rowData.values(formattedValue,effectiveFormat.backgroundColor))";
    var url = sheetsApiUrl(tabNames, fields);
    return fetch(url).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error("Sheets API error " + r.status + ": " + t.slice(0, 200)); });
      return r.json();
    }).then(function (json) {
      var out = {};
      (json.sheets || []).forEach(function (s) {
        out[s.properties.title] = { rowData: (s.data && s.data[0] && s.data[0].rowData) || [], merges: s.merges || [] };
      });
      return out;
    });
  }

  function cellText(cell) {
    return ((cell && cell.formattedValue) || "").trim();
  }

  function findMerge(merges, rowIdx, colIdx) {
    for (var i = 0; i < merges.length; i++) {
      var m = merges[i];
      if (rowIdx >= m.startRowIndex && rowIdx < m.endRowIndex && colIdx >= m.startColumnIndex && colIdx < m.endColumnIndex) return m;
    }
    return null;
  }

  function parseTimeLabel(str) {
    var m = str.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  function buildRuler(rowData, rulerRowIdx, startCol, endColExclusive, isAMSection) {
    var ruler = {};
    var offset = 0, last = -1, initialized = false;
    var row = rowData[rulerRowIdx];
    for (var c = startCol; c < endColExclusive; c++) {
      var t = cellText(row.values[c]);
      var base = parseTimeLabel(t);
      if (base === null) continue;
      if (!initialized) {
        // Sheet times are bare "4:00" style with no AM/PM. Weekday practice sessions
        // run afternoon/evening, so hours 1-11 default to PM unless this is an
        // explicitly-labeled "... AM" weekend section.
        var hour = Math.floor(base / 60);
        if (!isAMSection && hour >= 1 && hour < 12) offset = 12 * 60;
        initialized = true;
      }
      var val = base + offset;
      if (val < last) { offset += 12 * 60; val = base + offset; }
      last = val;
      ruler[c] = val;
    }
    return ruler;
  }

  function parseActivityText(raw) {
    var clean = raw.replace(/\s+/g, " ").trim();
    // "Label (Location) 4:15 - 5:00" style
    var m = clean.match(/^(.*?)\s*\(([^)]+)\)\s*[\d:apmAPM\-–\s]*$/);
    if (m && m[1]) return { label: m[1].trim(), location: m[2].trim() };
    // "CODE - Location" style
    m = clean.match(/^([A-Za-z0-9]{1,6})\s*-\s*(.+)$/);
    if (m) return { label: m[1].trim(), location: m[2].trim() };
    // fallback: strip a trailing time range if present
    var stripped = clean.replace(/[\d:apmAPM]{3,}\s*-\s*[\d:apmAPM]{3,}\s*$/, "").trim();
    return { label: stripped || clean, location: "" };
  }

  // Comp squads' cells often carry their own explicit time range as free text, e.g.
  // "Warm Up Condish (Team Rod + Team Tumble Strip) 4:00 - 5:00". Those merged cells don't
  // always line up neatly with the 15-minute ruler grid (coaches resize them by hand), so the
  // column-position math in sessionsForSquadRow can be several minutes off. When a cell's text
  // contains an explicit "H:MM - H:MM" range, that's the authoritative time — this extracts it.
  //
  // A cell can also pack more than one activity into a single merge, e.g.
  // "Bars (Rec Bars) 5:20-5:40          Fun 5:40 - 5:45" — two sessions typed into one cell
  // with extra spacing used to visually separate them. This finds every time range in the
  // text (not just a trailing one) and splits the cell into one segment per range, using
  // whatever text sits between consecutive ranges as that segment's own label.
  function parseEmbeddedSegments(raw, isAMSection, anchorMin) {
    var clean = raw.replace(/\s+/g, " ").trim();
    var re = /(\d{1,2}:\d{2})\s*(?:am|pm|AM|PM)?\s*[-–]\s*(\d{1,2}:\d{2})\s*(?:am|pm|AM|PM)?/g;
    var matches = [];
    var m;
    while ((m = re.exec(clean)) !== null) {
      matches.push({ startStr: m[1], endStr: m[2], index: m.index, length: m[0].length });
    }
    if (!matches.length) return null;

    function toAbsolute(base, prevAbsolute) {
      var hour = Math.floor(base / 60);
      var offset = (!isAMSection && hour >= 1 && hour < 12) ? 12 * 60 : 0;
      var val = base + offset;
      if (prevAbsolute !== null && val < prevAbsolute) val += 12 * 60;
      return val;
    }

    var segments = [];
    var cursorText = 0;
    var prevAbsolute = null;
    for (var i = 0; i < matches.length; i++) {
      var mt = matches[i];
      var startBase = parseTimeLabel(mt.startStr);
      var endBase = parseTimeLabel(mt.endStr);
      if (startBase === null || endBase === null) continue;
      var startAbs = toAbsolute(startBase, prevAbsolute);
      // For the FIRST time range found in this cell, there's nothing within the cell's own text
      // to resolve an ambiguous bare hour against, so anchor against the cell's own column
      // position on the time ruler (passed in by the caller) instead of guessing AM/PM purely
      // from the hour. This is what correctly reads a weekend "AM" section cell like
      // "Break 1:00 - 1:30" sitting in a column that's actually well past noon (that section
      // legitimately runs past noon — see WEEKEND_CUTOFF_MIN) as 1:00 PM rather than 1:00 AM.
      // Anchoring to this cell's OWN ruler position (rather than, say, the previous cell's parsed
      // end time) keeps this self-correcting per cell — a neighboring cell with a bad/mistyped
      // time can't cascade a wrong 12-hour shift into this one.
      if (prevAbsolute === null && typeof anchorMin === "number") {
        var altStart = startAbs + 12 * 60;
        if (Math.abs(altStart - anchorMin) < Math.abs(startAbs - anchorMin)) startAbs = altStart;
      }
      var endAbs = toAbsolute(endBase, startAbs);
      if (endAbs <= startAbs) continue;
      var labelText = clean.slice(cursorText, mt.index).trim();
      segments.push({ text: labelText, start: startAbs, end: endAbs });
      cursorText = mt.index + mt.length;
      prevAbsolute = endAbs;
    }
    return segments.length ? segments : null;
  }

  // Resolves a block's display color from its activity label: an exact code match (WU, VT,
  // UB, ...) wins, then a keyword match against the fuller Comp-squad descriptions, then
  // "Break" is forced black, and anything else falls back to whatever color the coach set
  // on that cell in the sheet.
  function resolveBlockColor(label, rawBg) {
    var trimmed = (label || "").trim();
    var code = trimmed.toUpperCase();
    if (CODE_COLORS[code]) return CODE_COLORS[code];
    // Rec-squad labels often lead with the short activity code followed by more descriptive
    // text (e.g. "WU Floor 2", "BB Rec BB", "VT Rec VT A/B + Rec TT") rather than being just
    // the bare code on its own. Without this, "WU Floor 2" fell all the way through to the
    // "floor" keyword check below and got colored as Floor Exercise instead of Warm Up, and
    // "BB Rec BB"/"VT Rec VT A/B..." matched nothing at all and fell back to whatever raw
    // color happened to be set on that sheet cell — both silently wrong, not a sheet problem.
    // Matching the leading word against the same CODE_COLORS map first fixes both cases.
    var leadMatch = trimmed.match(/^([A-Za-z]+)\b/);
    if (leadMatch && CODE_COLORS[leadMatch[1].toUpperCase()]) return CODE_COLORS[leadMatch[1].toUpperCase()];
    var lc = trimmed.toLowerCase();
    if (lc.indexOf("break") !== -1) return BREAK_COLOR;
    if (lc.indexOf("warm up") !== -1) return CODE_COLORS.WU;
    if (lc.indexOf("vault") !== -1) return CODE_COLORS.VT;
    if (lc.indexOf("bars") !== -1) return CODE_COLORS.UB;
    if (lc.indexOf("beam") !== -1) return CODE_COLORS.BB;
    if (lc.indexOf("floor") !== -1) return CODE_COLORS.FX;
    if (lc.indexOf("tramp") !== -1) return CODE_COLORS.TR;
    if (lc.indexOf("presch") !== -1 || lc.indexOf("kindy") !== -1) return CODE_COLORS.KG;
    return rawBg;
  }

  function extractDaySection(rowData, merges, sectionLabel) {
    var dayHeaders = [];
    rowData.forEach(function (r, i) {
      var v = cellText(r.values && r.values[0]);
      if (DAY_LABEL_RE.test(v)) dayHeaders.push({ index: i, label: v });
    });
    var target = null, nextIndex = rowData.length;
    for (var i = 0; i < dayHeaders.length; i++) {
      if (dayHeaders[i].label === sectionLabel) {
        target = dayHeaders[i];
        if (i + 1 < dayHeaders.length) nextIndex = dayHeaders[i + 1].index;
        break;
      }
    }
    if (!target) return null;
    // find ruler row: first row after header with a time-like value in a column >= 2
    var rulerRowIdx = -1;
    for (var r = target.index + 1; r < Math.min(nextIndex, target.index + 6); r++) {
      var row = rowData[r];
      if (!row || !row.values) continue;
      for (var c = 2; c < Math.min(row.values.length, 6); c++) {
        if (parseTimeLabel(cellText(row.values[c])) !== null) { rulerRowIdx = r; break; }
      }
      if (rulerRowIdx !== -1) break;
    }
    if (rulerRowIdx === -1) return null;
    var maxCols = 0;
    for (var rr = rulerRowIdx; rr < nextIndex; rr++) {
      if (rowData[rr] && rowData[rr].values) maxCols = Math.max(maxCols, rowData[rr].values.length);
    }
    var isAMSection = sectionLabel.indexOf("AM") !== -1;
    var ruler = buildRuler(rowData, rulerRowIdx, 2, maxCols, isAMSection);
    var rulerCols = Object.keys(ruler).map(Number).sort(function (a, b) { return a - b; });
    return { squadStart: rulerRowIdx + 1, squadEnd: nextIndex, ruler: ruler, rulerCols: rulerCols, maxCols: maxCols, isAMSection: isAMSection };
  }

  function sessionsForSquadRow(rowData, merges, rowIdx, ruler, rulerCols, maxCols, isAMSection) {
    var sessions = [];
    var row = rowData[rowIdx];
    var col = rulerCols.length ? rulerCols[0] : 2;
    var lastCol = rulerCols.length ? rulerCols[rulerCols.length - 1] : maxCols - 1;
    while (col <= lastCol) {
      var merge = findMerge(merges, rowIdx, col);
      var srcRow = merge ? merge.startRowIndex : rowIdx;
      var srcCol = merge ? merge.startColumnIndex : col;
      var endCol = merge ? merge.endColumnIndex : col + 1;
      var srcCell = rowData[srcRow] && rowData[srcRow].values ? rowData[srcRow].values[srcCol] : null;
      var text = cellText(srcCell);
      if (text) {
        // Prefer the cell's own explicit time range(s) (Comp squads write these in) over the
        // column/merge position, since merges don't always land cleanly on the 15-min grid.
        // A cell can embed more than one — each becomes its own session, positioned by its
        // own true time rather than by the single merge's column span. ruler[col] is passed in
        // as an anchor to resolve AM/PM ambiguity on the first range found (see the comment in
        // parseEmbeddedSegments).
        var segments = parseEmbeddedSegments(text, isAMSection, ruler[col]);
        var bg = (srcCell.effectiveFormat && srcCell.effectiveFormat.backgroundColor) ? colorToHex(srcCell.effectiveFormat.backgroundColor) : "#5a6b85";
        if (segments) {
          var prevParsed = null;
          segments.forEach(function (seg) {
            var parsed = parseActivityText(seg.text);
            // A later segment is often a short continuation of the one before it in the same
            // cell (e.g. "Bars (Rec Bars) 5:20-5:40 ... Fun 5:40-5:45") and carries no location
            // of its own. Rather than title the block with that short continuation word, keep
            // the main activity's name as the title and show the continuation underneath it —
            // e.g. titled "Bars" with "Fun" as its location line, not titled "Fun" alone.
            if (!parsed.location && prevParsed) {
              parsed = { label: prevParsed.label, location: parsed.label };
            }
            sessions.push({ label: parsed.label, location: parsed.location, start: seg.start, end: seg.end, bg: bg, srcCol: srcCol });
            prevParsed = parsed;
          });
        } else {
          var startMin = ruler[col] !== undefined ? ruler[col] : null;
          var endMin = ruler[endCol] !== undefined ? ruler[endCol] : (startMin !== null ? startMin + 15 * (endCol - col) : null);
          if (startMin !== null && endMin !== null && endMin > startMin) {
            var parsed2 = parseActivityText(text);
            sessions.push({ label: parsed2.label, location: parsed2.location, start: startMin, end: endMin, bg: bg, srcCol: srcCol });
          }
        }
      }
      col = endCol;
    }
    return sessions;
  }

  // A REC squad's own row can have a "class name" banner (e.g. "Little Sprouts 1", "Growing
  // Sprouts 2") typed directly into the row immediately above it in the sheet, as one merged
  // cell per rotation — spanning the exact same columns as that rotation's WU/TR/UB/FX blocks
  // below it. This reads that banner row the same way a squad row is read (walk the merges left
  // to right), but keeps only each segment's column span and text — no time parsing needed,
  // since matching happens by column against the squad row's own session.srcCol (see
  // loadAndRender), not by time. That sidesteps the known column↔printed-time drift (a
  // session's real time comes from its own cell text, not the ruler column — see
  // parseEmbeddedSegments above), which would otherwise make time-based matching unreliable.
  function bannerSegmentsForRow(rowData, merges, rowIdx) {
    var row = rowData[rowIdx];
    if (!row || !row.values) return [];
    var segs = [];
    var col = 0;
    var maxCol = row.values.length;
    while (col < maxCol) {
      var merge = findMerge(merges, rowIdx, col);
      var srcRow = merge ? merge.startRowIndex : rowIdx;
      var srcCol = merge ? merge.startColumnIndex : col;
      var endCol = merge ? merge.endColumnIndex : col + 1;
      if (srcRow === rowIdx) {
        var text = cellText(row.values[srcCol]);
        if (text) segs.push({ startCol: srcCol, endCol: endCol, label: text });
      }
      col = endCol;
    }
    return segs;
  }

  function formatMinutes(mins) {
    var h = Math.floor(mins / 60) % 24;
    var m = mins % 60;
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  }

  function tickClock() {
    var now = new Date();
    var timeFmt = new Intl.DateTimeFormat("en-US", { timeZone: TIMEZONE, hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true });
    document.getElementById("clockTime").textContent = timeFmt.format(now);
  }

  function showError(msg) {
    document.getElementById("rows").innerHTML = '<div id="errorMsg">' + msg + "</div>";
  }

  var legendCache = null;
  function fetchLegend() {
    if (legendCache) return Promise.resolve(legendCache);
    return fetchGrids(["Legend"]).then(function (grids) {
      var rowData = grids["Legend"] ? grids["Legend"].rowData : [];
      var items = [];
      rowData.forEach(function (r) {
        var code = cellText(r.values && r.values[1]);
        var name = cellText(r.values && r.values[2]);
        if (code && name) items.push({ code: code, name: name });
      });
      legendCache = items;
      return items;
    }).catch(function () { return []; });
  }

  function renderLegend(items) {
    var el = document.getElementById("legend");
    el.innerHTML = "";
    items.forEach(function (it) {
      var div = document.createElement("div");
      div.className = "legendItem";
      // Looked up by the exact code, same as the schedule blocks, so the legend always
      // matches what's shown above it.
      var bg = CODE_COLORS[(it.code || "").trim().toUpperCase()] || "#5a6b85";
      var fg = textColorFor(bg);
      div.innerHTML = '<span class="legendSwatch" style="background:' + bg + ";color:" + fg + '">' + it.code + "</span><span>" + it.name + "</span>";
      el.appendChild(div);
    });
  }

  // A block's label/location/time can run long enough, at the fixed clamp() font size, to
  // wrap past the block's own height — and since the block clips overflow, the time line
  // (last in the stack) is what silently disappears off the bottom. Shrinking that one
  // block's font just enough to make everything fit keeps every time range fully readable
  // without touching the rest of the row's sizing.
  // Raised from 18 to 24 (2026-11-19, Deepa: blocks still look small) now that the row-height
  // and chrome-padding changes above free up more real estate — fitBlockText still always
  // shrinks-to-fit per block first, so no block's text can be cut off; this just raises the
  // ceiling so a block with room to spare renders noticeably bigger than before.
  var BLOCK_FONT_MIN = 7, BLOCK_FONT_MAX = 24;
  function fitBlockText(el) {
    var min = BLOCK_FONT_MIN, max = BLOCK_FONT_MAX;
    for (var i = 0; i < 9; i++) {
      var mid = (min + max) / 2;
      el.style.fontSize = mid + "px";
      var fits = el.scrollWidth <= el.clientWidth && el.scrollHeight <= el.clientHeight;
      if (fits) { min = mid; } else { max = mid; }
    }
    el.style.fontSize = min + "px";
  }

  function renderSchedule(squads) {
    var rowsEl = document.getElementById("rows");
    var rulerEl = document.getElementById("ruler");
    rowsEl.innerHTML = "";
    rulerEl.innerHTML = "";

    if (!squads.length) {
      rowsEl.innerHTML = '<div id="emptyMsg">No classes scheduled right now.</div>';
      return;
    }

    var allStarts = [], allEnds = [];
    squads.forEach(function (sq) {
      sq.sessions.forEach(function (s) { allStarts.push(s.start); allEnds.push(s.end); });
    });
    if (!allStarts.length) {
      rowsEl.innerHTML = '<div id="emptyMsg">No classes scheduled right now.</div>';
      return;
    }
    var minT = Math.min.apply(null, allStarts);
    var maxT = Math.max.apply(null, allEnds);
    var span = Math.max(maxT - minT, 1);

    // Ruler ticks every 30 min, bold on the hour
    for (var t = Math.ceil(minT / 15) * 15; t <= maxT; t += 15) {
      var pct = ((t - minT) / span) * 100;
      var tick = document.createElement("div");
      var isHour = (t % 60) === 0;
      tick.className = "rulerTick" + (isHour ? " major" : "");
      tick.style.left = pct + "%";
      tick.textContent = formatMinutes(t).replace(" ", "");
      rulerEl.appendChild(tick);
    }

    // Build the row skeletons (label + empty track) first, then fill each track with blocks.
    var lastCategory = null;
    var rowItems = [];
    squads.forEach(function (sq) {
      if (lastCategory !== null && sq.category !== lastCategory) {
        var divider = document.createElement("div");
        divider.className = "groupDivider";
        rowsEl.appendChild(divider);
      }
      lastCategory = sq.category;

      var rowEl = document.createElement("div");
      rowEl.className = "squadRow";
      var label = document.createElement("div");
      label.className = "squadLabel " + (sq.category === "Comp" ? "cat-comp" : "cat-rec");
      label.innerHTML = '<span class="sqName">' + sq.name + '</span><span class="sqTag">' + sq.category + '</span>';

      var trackWrap = document.createElement("div");
      trackWrap.className = "squadTrackWrap";
      // Only squads that actually have a class-name banner above them in the sheet (see
      // bannerSegmentsForRow / loadAndRender) get the extra classTagRow strip — every other
      // row keeps the exact same full-height track it always had.
      var hasTags = sq.sessions.some(function (s) { return !!s.classTag; });
      var tagRow = null;
      if (hasTags) {
        tagRow = document.createElement("div");
        tagRow.className = "classTagRow";
        trackWrap.appendChild(tagRow);
      }
      var track = document.createElement("div");
      track.className = "squadTrack";
      trackWrap.appendChild(track);

      rowEl.appendChild(label);
      rowEl.appendChild(trackWrap);
      rowsEl.appendChild(rowEl);
      rowItems.push({ sq: sq, rowEl: rowEl, track: track, tagRow: tagRow });
    });

    // Two independent reasons a row might need a different share of #rows' total height than a
    // plain equal split would give it:
    //   1) A row with a classTagRow strip above its track needs that strip's own height on top
    //      of a normal track, or its blocks end up shorter than every other row's — this is
    //      what made some blocks' text (even the time, in one case) clip off entirely when the
    //      class-tag banner feature first shipped.
    //   2) Deepa asked (2026-11-19) to size Comp rows down and Rec rows up — Comp blocks now
    //      show only location + time, never the apparatus-name line (see dropLabel below), so
    //      they need less height to stay readable, and that freed room goes to the Rec rows,
    //      which are the ones most often stuck with narrow, text-heavy blocks.
    // Solved together as one weighted split: each row gets weight*baseUnit + its own fixed
    // addon (the tag-strip height, if it has one), where baseUnit is solved so all rows' total
    // heights sum to exactly the space #rows has available. This MUST run before any block is
    // built below — fitBlockText() measures each block's actual rendered box to pick its font
    // size, so the row heights have to be finalized first, or a comp row that's about to get
    // shrunk ends up with text already fitted (and now overflowing) its old, taller box.
    var COMP_ROW_WEIGHT = 0.8, REC_ROW_WEIGHT = 1.25;
    var rowsRect = rowsEl.getBoundingClientRect();
    var gapPx = parseFloat(getComputedStyle(rowsEl).rowGap) || 0;
    var dividerEls = rowsEl.querySelectorAll(".groupDivider");
    var dividerPx = 0;
    dividerEls.forEach(function (d) {
      var cs = getComputedStyle(d);
      dividerPx += d.getBoundingClientRect().height + parseFloat(cs.marginTop || 0) + parseFloat(cs.marginBottom || 0);
    });
    var totalChildren = rowItems.length + dividerEls.length;
    var gapsTotal = gapPx * Math.max(totalChildren - 1, 0);
    var taggedItems = rowItems.filter(function (it) { return !!it.tagRow; });
    var tagStripH = 0;
    if (taggedItems.length) {
      var sampleCs = getComputedStyle(taggedItems[0].tagRow);
      tagStripH = taggedItems[0].tagRow.getBoundingClientRect().height + parseFloat(sampleCs.marginTop || 0) + parseFloat(sampleCs.marginBottom || 0);
    }
    var totalWeight = rowItems.reduce(function (sum, it) {
      return sum + (it.sq.category === "Comp" ? COMP_ROW_WEIGHT : REC_ROW_WEIGHT);
    }, 0);
    var availableForWeighted = rowsRect.height - gapsTotal - dividerPx - taggedItems.length * tagStripH;
    var baseUnit = totalWeight ? availableForWeighted / totalWeight : 0;
    // Sanity guard: only apply this custom split if it leaves every row a sane, positive
    // height — if the math comes out degenerate (e.g. an unusually short viewport), leave the
    // default equal flex:1 1 0 in place rather than risk shrinking a row to near-nothing.
    if (baseUnit * Math.min(COMP_ROW_WEIGHT, REC_ROW_WEIGHT) > 24) {
      rowItems.forEach(function (it) {
        var weight = it.sq.category === "Comp" ? COMP_ROW_WEIGHT : REC_ROW_WEIGHT;
        var totalPx = weight * baseUnit + (it.tagRow ? tagStripH : 0);
        it.rowEl.style.flex = "1 1 " + totalPx + "px";
      });
    }

    rowItems.forEach(function (item) {
      // Every block sits at its own real start/end time, exactly matching the ruler above —
      // no widening, no pushing a short session's neighbors later. A session genuinely only 15
      // minutes long really does get a 15-minutes-wide box. Readability for a narrow box is
      // handled separately, by fitBlockText() shrinking that block's own font to whatever fits
      // (see below), not by moving the box off its true time. Deepa explicitly chose exact
      // ruler alignment over the previous minimum-width-widens-and-pushes-later behavior
      // (2026-11-12) — if blocks ever need to widen for readability again, that's a deliberate
      // product decision to revisit, not something to silently reintroduce here.
      item.sq.sessions.forEach(function (s) {
        var left = ((s.start - minT) / span) * 100;
        var width = ((s.end - s.start) / span) * 100;
        var block = document.createElement("div");
        block.className = "block";
        block.style.left = left + "%";
        block.style.width = Math.max(width, 0.3) + "%";
        var resolvedBg = resolveBlockColor(s.label, s.bg);
        block.style.background = resolvedBg;
        var fg = blockTextColor(resolvedBg);
        block.style.color = fg;
        // Comp blocks' first line (the apparatus name — "Warm Up", "Bars", "Vault"...) is
        // dropped so the block only needs to fit its location + time, not three lines — Deepa
        // asked (2026-11-19) for that freed-up room to go toward bigger Rec rows below (see the
        // row-height weighting above, before this loop). "Break" is kept as-is: it has no location
        // text of its own, so dropping its only line would leave the block showing nothing but
        // a bare time range. Rec blocks are untouched — they keep all three lines, same as ever.
        var dropLabel = item.sq.category === "Comp" && s.location && !/^break$/i.test(s.label);
        var html = dropLabel ? "" : '<span class="label">' + s.label + "</span>";
        if (s.location) html += '<span class="loc">' + s.location + "</span>";
        html += '<span class="time">' + formatMinutes(s.start) + " - " + formatMinutes(s.end) + "</span>";
        block.innerHTML = html;
        item.track.appendChild(block);
        fitBlockText(block);
      });

      // Render each run of consecutive same-tag sessions as one pill spanning their combined
      // time range, mirroring the single merged banner cell that covers that same rotation in
      // the sheet — rather than repeating the tag on every individual WU/TR/UB/FX block.
      if (item.tagRow) {
        var sessions = item.sq.sessions;
        var i = 0;
        while (i < sessions.length) {
          var tag = sessions[i].classTag;
          if (!tag) { i++; continue; }
          var j = i;
          while (j + 1 < sessions.length && sessions[j + 1].classTag === tag) j++;
          var groupStart = sessions[i].start, groupEnd = sessions[j].end;
          var tagLeft = ((groupStart - minT) / span) * 100;
          var tagWidth = ((groupEnd - groupStart) / span) * 100;
          var tagEl = document.createElement("div");
          tagEl.className = "classTag";
          tagEl.style.left = tagLeft + "%";
          tagEl.style.width = Math.max(tagWidth, 0.3) + "%";
          tagEl.textContent = tag;
          item.tagRow.appendChild(tagEl);
          i = j + 1;
        }
      }
    });
  }

  // A single failed fetch (a one-off network blip, or a transient hiccup in however the
  // display device is loading this page) shouldn't blank an otherwise-working TV — that's
  // worse than just leaving the previous schedule up for one more refresh cycle. So we only
  // show the on-screen error after several consecutive failures in a row (a real, ongoing
  // problem worth surfacing), or on the very first load when there's no prior schedule to
  // fall back to. Every other time, we just log it and quietly retry next tick.
  var FAILURE_THRESHOLD = 3;
  var hasRenderedOnce = false;
  var consecutiveFailures = 0;

  // The big day/time clock used a fixed vh-based size, which looked fine on a short label like
  // "Friday" but actually overflowed off the right edge of the screen (pushing the WEEK badge
  // out of view) on the longest real label, "Saturday PM", once the hour reaches a 2-digit
  // value (e.g. "12:59:59 PM") — that combination was never tested against before. This instead
  // sizes the clock dynamically: the biggest font that still leaves both side labels (brand,
  // week badge) fully visible with a safety margin, given whatever day label is actually
  // showing. Most days it renders noticeably bigger than the old fixed size; on "Saturday PM"
  // it backs off just enough to guarantee nothing is ever pushed off-screen.
  function fitHeaderClock() {
    var dayEl = document.getElementById("dayLabel");
    var clockEl = document.getElementById("clockTime");
    var brandEl = document.getElementById("brand");
    var weekEl = document.getElementById("weekCol"); // measure the whole week+lesson-plan column, not just the week text
    var topBarEl = document.getElementById("topBar");
    var headerCenterEl = document.getElementById("headerCenter");

    var topBarStyle = getComputedStyle(topBarEl);
    var paddingX = parseFloat(topBarStyle.paddingLeft) + parseFloat(topBarStyle.paddingRight);
    var columnGap = parseFloat(topBarStyle.columnGap || topBarStyle.gap) || 0;
    var SAFETY_MARGIN = 40; // px of guaranteed breathing room, so text never sits flush against its neighbor

    // Reserve the widest possible clock string (a 2-digit hour) while measuring, so whatever
    // size we land on stays valid for the whole day, not just the instant we happen to fit it.
    var realClockText = clockEl.textContent;
    clockEl.textContent = "12:59:59 PM";

    // Deepa asked (2026-11-19) to size the clock down, then again the same day to go smaller
    // still, to free up more vertical room in #topBar for the schedule grid below — the cap
    // was 220 originally, then 150, then 100 (which barely changed anything — see below), now
    // 78. This cap is a hard ceiling, not just a fallback: on a wide screen the width-based fit
    // alone lands around 100-102px, well above a cap of 100, so that first drop to 100 made
    // almost no visible difference. 78 is comfortably below that width-based fit, so it's what
    // actually governs the size now and reliably shrinks the clock.
    var min = 30, max = 78;
    for (var i = 0; i < 11; i++) {
      var mid = (min + max) / 2;
      dayEl.style.fontSize = mid + "px";
      clockEl.style.fontSize = mid + "px";
      var used = brandEl.getBoundingClientRect().width + headerCenterEl.getBoundingClientRect().width + weekEl.getBoundingClientRect().width + columnGap * 2;
      var avail = topBarEl.clientWidth - paddingX;
      if (used + SAFETY_MARGIN <= avail) { min = mid; } else { max = mid; }
    }
    dayEl.style.fontSize = min + "px";
    clockEl.style.fontSize = min + "px";
    clockEl.textContent = realClockText;
  }

  // The TV is read from across a room, where "FRIDAY" vs. "MON" makes no real difference to
  // legibility — but the full weekday name (especially "Saturday"/"Sunday" with their AM/PM
  // suffix) was the single biggest thing eating into the clock's available width in
  // fitHeaderClock above. Three-letter day codes free that space up for a noticeably bigger
  // clock on every single day, not just the short-named ones. This only changes what's
  // DISPLAYED — info.sectionLabel itself (the full name) is still what's used below to match
  // the day section against the sheet's own day headers, completely untouched.
  function abbreviateDayLabel(sectionLabel) {
    var m = sectionLabel.match(/^(\w+)(\s(AM|PM))?$/);
    if (!m) return sectionLabel;
    return m[1].slice(0, 3) + (m[2] || "");
  }

  function loadAndRender() {
    var now = getNow();
    var info = computeWeekAndSection(now);
    document.getElementById("dayLabel").textContent = abbreviateDayLabel(info.sectionLabel);
    document.getElementById("weekLabel").textContent = "Week " + info.weekNumber;
    var lessonPlanEl = document.getElementById("lessonPlanLabel");
    if (info.lessonPlan) {
      lessonPlanEl.textContent = "Lesson Plan " + info.lessonPlan;
      lessonPlanEl.style.display = "block";
    } else {
      lessonPlanEl.style.display = "none";
      lessonPlanEl.textContent = "";
    }
    fitHeaderClock();

    Promise.all([fetchGrids([info.tabName]), fetchLegend()]).then(function (results) {
      var grids = results[0];
      var legendItems = results[1];
      renderLegend(legendItems);
      var sheet = grids[info.tabName];
      if (!sheet) throw new Error("Could not read tab '" + info.tabName + "'.");
      var section = extractDaySection(sheet.rowData, sheet.merges, info.sectionLabel);
      if (!section) { renderSchedule([]); hasRenderedOnce = true; consecutiveFailures = 0; return; }
      var squads = [];
      var rulerRowIdx = section.squadStart - 1;
      for (var r = section.squadStart; r < section.squadEnd; r++) {
        var row = sheet.rowData[r];
        if (!row || !row.values) continue;
        var name = cellText(row.values[0]);
        if (!name) continue;
        var sessions = sessionsForSquadRow(sheet.rowData, sheet.merges, r, section.ruler, section.rulerCols, section.maxCols, section.isAMSection);
        // If the sheet row directly above this squad's row has no squad name of its own, it's
        // a candidate "class name" banner row (see bannerSegmentsForRow) rather than another
        // squad — tag each of this squad's sessions with whichever banner segment covers its
        // column. Excludes the ruler row itself (the first squad row's "row above" is the ruler,
        // never a banner).
        if (r - 1 !== rulerRowIdx) {
          var aboveRow = sheet.rowData[r - 1];
          if (aboveRow && aboveRow.values && !cellText(aboveRow.values[0])) {
            var bannerSegs = bannerSegmentsForRow(sheet.rowData, sheet.merges, r - 1);
            if (bannerSegs.length) {
              sessions.forEach(function (s) {
                var seg = bannerSegs.filter(function (b) { return s.srcCol >= b.startCol && s.srcCol < b.endCol; })[0];
                if (seg) s.classTag = seg.label;
              });
            }
          }
        }
        if (sessions.length) squads.push({ name: name, category: categorize(name), sessions: sessions });
      }
      // Comp squads first, then Rec squads, preserving sheet order within each group.
      squads.sort(function (a, b) {
        if (a.category === b.category) return 0;
        return a.category === "Comp" ? -1 : 1;
      });
      renderSchedule(squads);
      hasRenderedOnce = true;
      consecutiveFailures = 0;
    }).catch(function (err) {
      console.error(err);
      consecutiveFailures++;
      if (!hasRenderedOnce || consecutiveFailures >= FAILURE_THRESHOLD) {
        showError("Schedule data unavailable right now — it'll retry automatically.<br>" + (err && err.message ? err.message : ""));
      }
      // else: keep whatever's already on screen and just try again next tick.
    });
  }

  (function scheduleMidnightReload() {
    var now = new Date();
    var next = new Date(now);
    next.setHours(24, 1, 0, 0);
    setTimeout(function () { window.location.reload(); }, next.getTime() - now.getTime());
  })();

  // A TV screen that's been left open for hours only re-fetches the SHEET data on each
  // REFRESH_MS tick — it keeps running whatever version of this page's own code was loaded
  // when the tab was opened, until the once-a-day midnight reload above. That means a fix
  // pushed mid-afternoon wouldn't actually reach an already-open screen until that night at
  // the earliest. To close that gap, also re-fetch this page's own HTML on the same cadence;
  // if it's changed since we loaded (i.e. a new version has been published), reload right
  // away so a deploy reaches the screen within minutes instead of hours.
  var selfCheckBaseline = null;
  function checkForPageUpdate() {
    fetch(location.pathname + "?selfcheck=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (text) {
        if (selfCheckBaseline === null) { selfCheckBaseline = text; return; }
        if (text !== selfCheckBaseline) window.location.reload();
      })
      .catch(function () { /* transient network hiccup — just try again next tick */ });
  }

  tickClock();
  setInterval(tickClock, 1000);
  loadAndRender();
  setInterval(loadAndRender, REFRESH_MS);
  checkForPageUpdate();
  setInterval(checkForPageUpdate, REFRESH_MS);
</script>
</body>
</html>
